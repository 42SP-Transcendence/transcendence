name: transcendence

services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
      args:
        APP: api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        APP: web
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build: infra/nginx
    ports:
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - ./infra/nginx/certs:/etc/nginx/certs
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  postgres-data:
